<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0055FF">
  <meta name="robots" content="noindex, nofollow">
  <title>DCR Sicily Cars s.r.l.s - Accesso Admin</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16-DXlcJHXh.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32-ZBNlCYIR.png">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-Dfj_pARn.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-Cg6-jwNQ.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/adminLogin-CmNQydpM.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/i18n-CFup1TB9.js">
  <link rel="stylesheet" crossorigin href="/assets/i18n-CYZY5_rF.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img src="/assets/logo-9i96fMMx.svg" alt="DCR Sicily Cars s.r.l.s" style="height:60px;margin:0 auto 1rem;">
      <h1 data-i18n="admin.login_title">Admin Panel</h1>
    </div>
    <form class="login-form" id="login-form">
      <div class="form-group">
        <label for="login-email" data-i18n="admin.email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password" data-i18n="admin.password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="login-error" style="color:var(--color-danger);font-size:0.875rem;margin-bottom:1rem;display:none;"></div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" data-i18n="admin.login">
        Accedi
      </button>
      <div class="login-lang">
        <button class="lang-btn active" data-lang="it">IT</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </form>
  </div>
</body>
</html>
