<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0055FF">
  <meta name="robots" content="noindex, nofollow">
  <title>DCR Sicily Cars s.r.l.s - Accesso Admin</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img src="../assets/logo.svg" alt="DCR Sicily Cars s.r.l.s" style="height:60px;margin:0 auto 1rem;">
      <h1 data-i18n="admin.login_title">Admin Panel</h1>
    </div>
    <form class="login-form" id="login-form">
      <div class="form-group">
        <label for="login-email" data-i18n="admin.email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password" data-i18n="admin.password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="login-error" style="color:var(--color-danger);font-size:0.875rem;margin-bottom:1rem;display:none;"></div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" data-i18n="admin.login">
        Accedi
      </button>
      <div class="login-lang">
        <button class="lang-btn active" data-lang="it">IT</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </form>
  </div>
  <script type="module">
    import './css/admin.css'
    import { i18n } from '../js/i18n.js'
    window.i18n = i18n

    document.querySelectorAll('.login-lang .lang-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.login-lang .lang-btn').forEach(b => b.classList.remove('active'))
        this.classList.add('active')
        i18n.setLang(this.dataset.lang)
      })
    })

    const form = document.getElementById('login-form')
    const emailInput = document.getElementById('login-email')
    const passwordInput = document.getElementById('login-password')
    const errorEl = document.getElementById('login-error')

    if (localStorage.getItem('dcr-admin')) {
      try {
        const admin = JSON.parse(localStorage.getItem('dcr-admin'))
        if (admin.loggedIn) {
          window.location.href = 'index.html'
        }
      } catch (_) {}
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.style.display = 'none'

      const email = emailInput.value.trim()
      const password = passwordInput.value

      if (!email || !password) {
        errorEl.textContent = 'Inserisci email e password.'
        errorEl.style.display = 'block'
        return
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })

        const data = await res.json()

        if (data.success) {
          localStorage.setItem('dcr-admin', JSON.stringify({ loggedIn: true, email, password }))
          window.location.href = '/admin/'
        } else {
          errorEl.textContent = data.error || 'Email o password non validi.'
          errorEl.style.display = 'block'
        }
      } catch (err) {
        errorEl.textContent = 'Errore di connessione al server.'
        errorEl.style.display = 'block'
      }
    })

    i18n.init().then(() => i18n.applyLanguage())
  </script>
</body>
</html>
