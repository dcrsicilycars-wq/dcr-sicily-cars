<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0055FF">
  <title>DCR Sicily Cars s.r.l.s - Accesso Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img src="../assets/logo.svg" alt="DCR Sicily Cars s.r.l.s" style="height:60px;margin:0 auto 1rem;">
      <h1 data-i18n="admin.login_title">Admin Panel</h1>
    </div>
    <form class="login-form" id="login-form">
      <div class="form-group">
        <label for="login-email" data-i18n="admin.email">Email</label>
        <input type="email" id="login-email" placeholder="admin@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password" data-i18n="admin.password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="login-error" style="color:var(--color-danger);font-size:0.875rem;margin-bottom:1rem;display:none;"></div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" data-i18n="admin.login">
        Accedi
      </button>
      <div class="login-lang">
        <button class="lang-btn active" data-lang="it">IT</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </form>
  </div>
  <script type="module">
    import { i18n } from '../js/i18n.js'
    window.i18n = i18n
    document.querySelectorAll('.login-lang .lang-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.login-lang .lang-btn').forEach(b => b.classList.remove('active'))
        this.classList.add('active')
        i18n.setLang(this.dataset.lang)
      })
    })
    i18n.init().then(() => i18n.applyLanguage())
  </script>
  <script src="js/login.js"></script>
</body>
</html>
